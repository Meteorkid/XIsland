name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check documentation links, fences and release invariants
        run: python3 Scripts/check-docs.py
      - name: Test documentation checker failure paths
        run: python3 Scripts/test-check-docs.py
      - name: Check Swift runtime safety tokens
        run: python3 Scripts/check-swift-safety.py
      - name: Test Swift safety gate failure paths
        run: python3 Scripts/test-check-swift-safety.py
      - name: Check engineering loop state
        run: python3 Scripts/check-loop-state.py
      - name: Test engineering loop state failure paths
        run: python3 Scripts/test-check-loop-state.py
      - name: Check release metadata
        run: bash Scripts/preflight-release.sh
      - name: Test release preflight failure paths
        run: bash Scripts/test-preflight-release.sh
