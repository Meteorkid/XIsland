name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Core and adapter tests
        run: npm test
      - name: Build frontend and packaged hook
        shell: bash
        run: npm run build && npm run build:hook
      - name: Native protocol and Windows pipe tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Compile Windows desktop integration
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Install browser for UI checks
        run: npx playwright install chromium
      - name: Browser interaction checks
        run: npx playwright test
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-browser-results
          path: windows/test-results/
          if-no-files-found: ignore
          retention-days: 14
