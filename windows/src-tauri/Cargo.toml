[package]
name = "xisland-windows"
version = "0.1.2"
edition = "2021"
description = "Windows client for XIsland"
default-run = "xisland"

[lib]
name = "xisland_windows"
path = "src/lib.rs"

[[bin]]
name = "xisland"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "xisland-bridge"
path = "src/bin/bridge.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "process"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["parsing"] }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
